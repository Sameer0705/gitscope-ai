<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitScope AI</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <div class="container">

        <!-- Header -->
        <div class="header">
        <div class="logo">🔭 GitScope AI</div>
        <p class="tagline">Analyze any GitHub profile — report card, roast, and dev battles</p>
        </div>

        <!-- Search -->
        <div class="search-box">
            <input type="text" id="username-input" placeholder="Enter a GitHub username..." />
            <button id="search-btn">Analyze</button>
        </div>

        <!-- Error message -->
        <p id="error-msg" class="error hidden"></p>

        <!-- Profile card -->
        <div id="profile-card" class="hidden">
            <img id="avatar" src="" alt="avatar" />
            <div class="profile-info">
                <h2 id="profile-name"></h2>
                <p id="profile-username"></p>
                <p id="profile-bio"></p>
                <p id="profile-location"></p>
                <div class="stats">
                    <span id="stat-followers"></span>
                    <span id="stat-following"></span>
                    <span id="stat-repos"></span>
                </div>
            </div>
        </div>

        <!-- AI Roast Button -->
        <div id="roast-btn-wrapper" class="hidden">
            <button id="roast-btn">🔥 Roast Me</button>
        </div>

        <!-- AI Output -->
        <div id="roast-section" class="hidden">
            <h3>🤖 AI Report Card + Roast</h3>
            <div id="roast-output"></div>
        </div>

        <!-- Repos list -->
        <div id="repos-section" class="hidden">
            <h3>Top Repositories</h3>
            <div id="repos-list"></div>
        </div>

        <!-- Comparison Mode -->
    <div id="compare-section">
      <p class="section-title">⚔️ Battle Mode</p>
      <p class="section-sub">Drop two GitHub usernames and watch the carnage</p>
      <div class="compare-inputs">
        <input type="text" id="compare-user1" placeholder="First username..." />
        <span class="vs-badge">VS</span>
        <input type="text" id="compare-user2" placeholder="Second username..." />
        <button id="compare-btn">⚔️ Battle</button>
      </div>

      <p id="compare-error" class="error hidden"></p>

      <!-- Side by side cards -->
      <div id="compare-cards" class="hidden">
        <div class="compare-card" id="card-user1">
          <img id="c-avatar1" src="" alt="" />
          <h4 id="c-name1"></h4>
          <p id="c-username1"></p>
          <div class="compare-stats">
            <span id="c-stars1"></span>
            <span id="c-followers1"></span>
            <span id="c-repos1"></span>
          </div>
        </div>

        <div class="compare-card" id="card-user2">
          <img id="c-avatar2" src="" alt="" />
          <h4 id="c-name2"></h4>
          <p id="c-username2"></p>
          <div class="compare-stats">
            <span id="c-stars2"></span>
            <span id="c-followers2"></span>
            <span id="c-repos2"></span>
          </div>
        </div>
      </div>

      <!-- AI Verdict -->
      <div id="verdict-section" class="hidden">
        <h3>🤖 AI Verdict</h3>
        <div id="verdict-output"></div>
      </div>
    </div>

    </div>

    <script src="app.js"></script>
</body>

</html>
